name: Docker Build (feature branches)

# 推到 feature/* 或 custom-main 时自动构建并推到 ghcr.io，
# 也可在 GitHub Actions UI 手动 dispatch 触发任意 ref。
# 与官方 release.yml 互不干扰 — 官方那个走 v* tag。

on:
  push:
    branches:
      - 'feature/**'
      - 'custom-main'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (defaults to current branch)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Compute lowercase image name
        id: image
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          REPO=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')
          echo "name=${{ env.REGISTRY }}/${OWNER}/${REPO}" >> $GITHUB_OUTPUT

      - name: Compute build metadata
        id: meta
        run: |
          BRANCH_TAG=$(echo "${{ github.ref_name }}" | sed 's|/|-|g' | tr '[:upper:]' '[:lower:]')
          SHA_SHORT=$(echo '${{ github.sha }}' | cut -c1-7)
          BASE_VERSION=$(tr -d '\r\n' < backend/cmd/server/VERSION)
          IMAGE="${{ steps.image.outputs.name }}"
          {
            echo "branch_tag=${IMAGE}:${BRANCH_TAG}"
            echo "sha_tag=${IMAGE}:sha-${SHA_SHORT}"
            echo "version=${BASE_VERSION}-${BRANCH_TAG}-${SHA_SHORT}"
            echo "commit=${SHA_SHORT}"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.branch_tag }}
            ${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}

      - name: Summary
        run: |
          {
            echo "## Docker image pushed"
            echo ""
            echo '```bash'
            echo "docker pull ${{ steps.meta.outputs.branch_tag }}"
            echo "docker pull ${{ steps.meta.outputs.sha_tag }}"
            echo '```'
            echo ""
            echo "View on GHCR: https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }}"
          } >> $GITHUB_STEP_SUMMARY
